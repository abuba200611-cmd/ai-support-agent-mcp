# يشتغل محليًا للتجربة، ونفس الملف يُستخدم على الـVPS للنشر
# تشغيل:  docker compose -f deploy/docker-compose.yml up -d --build

services:
  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: support-agent
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "3000:3000"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: support-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - AGENT_URL=http://agent:3000/chat
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - agent

volumes:
  n8n_data:
